<!doctype html><html lang="pt-BR"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Map calibration · RC1</title><style>body{margin:0;background:#0a1120;color:#dff5eb;font:14px system-ui}header{display:flex;gap:12px;padding:12px;align-items:center;flex-wrap:wrap}select,button{padding:8px;background:#16332d;color:#fff;border:1px solid #488b72}iframe{width:100%;height:calc(100vh - 100px);border:0}label{white-space:nowrap}#status{color:#90e3b6}</style><header><b>CALIBRAÇÃO · TERRAIN REAL</b><select id="scenario" aria-label="Cenário"></select><label>Escala <select id="scale"><option value="0">Final por tipo</option><option>1.00</option><option>1.15</option><option>1.22</option><option>1.30</option></select></label><label><input type="checkbox" name="layer" value="structures" checked>Estruturas</label><label><input type="checkbox" name="layer" value="pits" checked>Pits</label><label><input type="checkbox" name="layer" value="paths" checked>Paths</label><label><input type="checkbox" name="layer" value="actors">Atores</label><label><input type="checkbox" name="layer" value="waves">Frentes</label><span id="status"></span></header><iframe title="Mapa calibrado" src="../index.html?mapdebug=1"></iframe><script>
const frame=document.querySelector('iframe'),pick=document.querySelector('#scenario');let cases=[];
frame.onload=async()=>{const w=frame.contentWindow;while(!w.GameManager||w.PGHStore.screen==='BOOT')await new Promise(r=>setTimeout(r,100));for(const f of ['jungle-fixtures.js','structure-fixtures.js'])await new Promise((r,j)=>{const s=w.document.createElement('script');s.src='tests/'+f;s.onload=r;s.onerror=j;w.document.body.appendChild(s);});cases=[...w.JG_STRUCTURE_FIXTURES,...w.JG_FIXTURES.cases,...w.PGH_JUNGLE];pick.innerHTML='';cases.forEach((s,i)=>pick.add(new Option(s.id,i)));render();};
function render(){const w=frame.contentWindow,sc=cases[+pick.value];if(!sc)return;w.PGH_MAP_SCALE_OVERRIDE=Number(document.querySelector('#scale').value)||null;w.PGH_MAP_DEBUG_GROUPS=Array.from(document.querySelectorAll('[name=layer]:checked'),e=>e.value);w.GameManager.cleanup();w.UI.showScreen('game');w.document.querySelector('#game-name-tag').textContent='CALIBRAÇÃO';const g=w.GameManager.get('jungle'),s=g.createInitialState([],{});s.scenarios=[sc];s.rounds=1;s.roundIndex=0;s.roundEndsAt=Date.now()+3600000;g.render(g.getPublicState(s));document.querySelector('#status').textContent=sc.id+' · centros normalizados [0,1]';}
document.querySelectorAll('select,input').forEach(e=>e.onchange=render);
</script></html>
