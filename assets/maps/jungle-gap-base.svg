<svg xmlns="http://www.w3.org/2000/svg" width="586" height="588" viewBox="0 0 1000 1000" preserveAspectRatio="none" role="img" aria-labelledby="map-title map-description">
<title id="map-title">Minimapa do League of Legends</title>
<desc id="map-description">Imagem original preservada, com ajuste moderado de nitidez na renderização.</desc>
<defs>
<filter id="map-sharpness" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
<feConvolveMatrix order="3" kernelMatrix="0 -0.2 0 -0.2 1.8 -0.2 0 -0.2 0" divisor="1" bias="0" edgeMode="duplicate" preserveAlpha="true"/>
</filter>
</defs>
<image id="map-image" x="0" y="0" width="1000" height="1000" preserveAspectRatio="none" pointer-events="none" filter="url(#map-sharpness)" href="../../uploads/minimapa-lol-original.jpg"/>
<g id="map-overlay" pointer-events="none"/>
</svg>
